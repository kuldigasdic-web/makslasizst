<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrika AR Etiķete</title>
    <!-- A-Frame un MindAR bibliotēkas -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script>
      // Automātiski pielāgo plaknes platumu un augstumu atbilstoši bildes īstajām proporcijām
      AFRAME.registerComponent('auto-aspect-ratio', {
        schema: {
          baseWidth: { type: 'number', default: 0.8 } // Etiķetes platums metros
        },
        init: function () {
          const el = this.el;
          const img = document.querySelector(el.getAttribute('src'));

          const applyRatio = () => {
            const naturalWidth = img.naturalWidth || 1;
            const naturalHeight = img.naturalHeight || 1;
            const ratio = naturalHeight / naturalWidth;
            const targetWidth = this.data.baseWidth;
            const targetHeight = targetWidth * ratio;

            el.setAttribute('width', targetWidth);
            el.setAttribute('height', targetHeight);
          };

          if (img.complete) {
            applyRatio();
          } else {
            img.addEventListener('load', applyRatio);
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets1.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 5;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="labelImg" src="./palaistatgriezties.jpg">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          - position="0 -0.7 0.05": nobīda etiķeti uz leju zem mākslas darba centra
          - auto-aspect-ratio="baseWidth: 0.7": saglabā oriģinālo malu attiecību (platumu vari brīvi mainīt)
          - animation: rada lēnu un vieglu levitācijas efektu
        -->
        <a-plane 
          src="#labelImg" 
          auto-aspect-ratio="baseWidth: 0.7"
          position="0 -0.7 0.05" 
          material="transparent: true; opacity: 0.98;"
          animation="property: position; to: 0 -0.73 0.05; dir: alternate; dur: 2200; easing: easeInOutSine; loop: true">
        </a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
