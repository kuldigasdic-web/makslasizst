<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrika AR</title>
    <!-- A-Frame un MindAR bibliotēkas -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets1.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 5;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Tava AR bilde -->
        <img id="arBilde" src="./palaistatgriezties.jpg">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Pirmais target objekts failā targets1.mind (indekss 0) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          src="#arBilde" 
          position="0 0 0.05" 
          height="1.0" 
          width="1.0">
        </a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
